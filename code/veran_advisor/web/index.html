<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VÉRAN · 顾问话术工作台</title>
<style>
:root{--ink:#171b1a;--muted:#626b66;--line:#d8ddd7;--paper:#f3f4ee;--lime:#d3ef83}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,'Microsoft YaHei',sans-serif}header{border-bottom:1px solid var(--line);padding:20px 5vw;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:28px;letter-spacing:5px;font-weight:650}.header-links{display:flex;gap:18px;align-items:center}a{color:inherit;text-underline-offset:4px}main{max-width:1340px;margin:0 auto;padding:32px 5vw 50px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted)}h1{font-size:30px;letter-spacing:-1px;margin:4px 0 8px}h2{font-size:18px;margin:0}p{margin:8px 0}.intro{margin-bottom:26px;color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(320px,1fr) minmax(340px,1fr);gap:28px}.panel{background:#fff;border:1px solid var(--line);padding:24px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:14px}label{display:block;font-weight:600;margin:16px 0 6px}select,textarea{font:inherit;border:1px solid #bac3b9;border-radius:0;width:100%;padding:10px 12px;background:#fff;color:var(--ink)}textarea{resize:vertical;min-height:82px}textarea:focus,select:focus{outline:2px solid #8caa57;outline-offset:2px}.hint{font-size:12px;color:var(--muted);margin:3px 0 10px}button{font:inherit;cursor:pointer;border:1px solid var(--ink);padding:9px 15px;background:#fff;color:var(--ink)}button:hover{background:#eef1e8}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--ink);color:#fff;width:100%;margin-top:22px;font-weight:600;padding:13px}.primary:hover{background:#354033}.subtle{border:0;background:transparent;text-decoration:underline;text-underline-offset:4px;padding:0;font-size:13px}.badge{font-size:12px;background:var(--lime);padding:4px 9px;white-space:nowrap}.empty{padding:55px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line)}.status{font-size:14px;color:var(--muted);min-height:24px;margin:12px 0}.error{color:#9b342f}.candidate{border-top:1px solid var(--line);padding:19px 0}.candidate:first-child{border-top:0}.candidate-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.candidate-label{font-size:12px;letter-spacing:1px;color:var(--muted)}.message{font-size:17px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 2px}.note{background:#f1f4eb;padding:13px 15px;margin-top:15px;font-size:14px}.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-top:18px}.actions{display:flex;gap:18px;margin-top:18px}.hidden{display:none!important}footer{font-size:12px;color:var(--muted);margin-top:26px}@media(max-width:820px){.grid{grid-template-columns:1fr}header{align-items:flex-start}.header-links{font-size:12px;gap:10px}main{padding-top:22px}.panel{padding:18px}h1{font-size:25px}}
</style></head><body>
<header><div class="brand">VÉRAN</div><div class="header-links"><a href="/report/BDE_Methodology_Evaluation_Improvements.pdf" target="_blank" rel="noopener">项目报告</a><a href="/report/C_Test_Cases.xlsx" target="_blank" rel="noopener">50 个测试案例</a><button class="subtle" id="stop">关闭工具</button></div></header>
<main><div class="eyebrow">CLIENT ADVISOR WORKBENCH</div><h1>把已知信息，变成自然的对话。</h1><p class="intro">输入一个新案例，生成三条中文微信话术。由顾问审核和选择。</p>
<div class="grid"><section class="panel"><div class="panel-head"><h2>案例信息</h2><button id="example" type="button">填入示例</button></div><form id="form">
<label for="scenario">沟通场景</label><select id="scenario" name="scenario"><option value="greeting">生日与节日问候</option><option value="recommendation" selected>产品推荐</option><option value="aftercare">售后关怀</option><option value="reactivation">沉睡客户唤醒</option><option value="invitation">活动邀请</option><option value="price_objection">价格异议</option></select>
<label for="client">客户信息</label><textarea id="client" maxlength="6000" placeholder="已确认的偏好、需求和关系；可用称呼请明确写出。"></textarea>
<label for="history">最近聊天记录</label><textarea id="history" maxlength="10000" placeholder="客户：……&#10;顾问：……"></textarea><p class="hint">优先填写客户最新的问题或表态。</p>
<label for="product">产品信息</label><textarea id="product" maxlength="6000" placeholder="商品名称、设计细节、价格等；不适用时留空。"></textarea>
<label for="details">其他已知信息</label><textarea id="details" maxlength="6000" placeholder="节日或生日、购买记录、活动安排、优惠或售后政策、联系限制等。"></textarea><p class="hint">不清楚的写“未提供”。仅使用虚构人物和资料。</p>
<button id="generate" class="primary" type="submit">生成三条候选话术</button></form></section>
<section class="panel" aria-live="polite"><div class="panel-head"><h2>候选话术</h2><span class="badge">中文 · 简洁 · 有分寸</span></div><div id="status" class="status" role="status"></div><div id="empty" class="empty">填写左侧案例后，点击生成。<br>也可以先填入示例体验。</div><div id="results"></div><div id="note" class="note hidden"></div><div id="meta" class="meta"></div><div id="downloads" class="actions hidden"><button id="download" class="subtle">保存本次输入与结果</button></div></section></div>
<footer>每次点击都会实际生成新话术，通常需要等待十几秒，网络繁忙时可能更久。结果不会自动发送给客户。</footer></main>
<script>
const byId=id=>document.getElementById(id);let latest=null;let busy=false;
byId('example').onclick=()=>{byId('scenario').value='recommendation';byId('client').value='偏好有设计感、日常也能穿的单品。关系和称呼未提供。';byId('history').value='客户：想找一件不太正式的短外套，预算五千左右。';byId('product').value='折影短外套，短款，错位口袋，价格 4,800 元。材质、颜色和库存未提供。';byId('details').value='回应客户的外套需求；不编造优惠或库存。';};
function setStatus(text,error=false){byId('status').textContent=text;byId('status').className='status'+(error?' error':'');}
async function copyMessage(text,button){try{await navigator.clipboard.writeText(text);button.textContent='已复制';setTimeout(()=>button.textContent='复制',1200);}catch{setStatus('可选中话术后手动复制。');}}
byId('form').onsubmit=async event=>{event.preventDefault();if(busy)return;busy=true;byId('generate').disabled=true;byId('example').disabled=true;byId('stop').disabled=true;latest=null;byId('results').replaceChildren();byId('note').classList.add('hidden');byId('downloads').classList.add('hidden');byId('meta').textContent='';byId('empty').classList.add('hidden');setStatus('正在生成，请稍等……');const input={scenario:byId('scenario').value,client_information:byId('client').value||'未提供',conversation_history:byId('history').value||'无',product_information:byId('product').value||'未提供',scenario_details:byId('details').value||'未提供'};try{const response=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input)});const result=await response.json();if(!response.ok)throw new Error(result.error||'生成未成功，请重试。');latest={input,result};if(result.status==='ready'){result.messages.forEach((message,index)=>{const article=document.createElement('article');article.className='candidate';const head=document.createElement('div');head.className='candidate-head';const label=document.createElement('span');label.className='candidate-label';label.textContent='候选 '+(index+1);const copy=document.createElement('button');copy.textContent='复制';copy.className='subtle';copy.onclick=()=>copyMessage(message,copy);head.append(label,copy);const text=document.createElement('p');text.className='message';text.textContent=message;article.append(head,text);byId('results').append(article);});setStatus('已生成三条候选，请审核后选择。');}else{setStatus(result.status==='blocked'?'本次不建议联系客户。':'请补充必要信息后再生成。');}if(result.note){byId('note').textContent='顾问备注：'+result.note;byId('note').classList.remove('hidden');}byId('meta').textContent=`本次记录 ${result.run_id} · ${result.prompt_version} · ${result.elapsed_seconds} 秒`;byId('downloads').classList.remove('hidden');}catch(error){setStatus(error.message,true);byId('empty').textContent='可调整输入后重试。';byId('empty').classList.remove('hidden');}finally{busy=false;byId('generate').disabled=false;byId('example').disabled=false;byId('stop').disabled=false;}};
byId('download').onclick=()=>{if(!latest)return;const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(latest,null,2)],{type:'application/json;charset=utf-8'}));link.download=latest.result.case_id+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);};
byId('stop').onclick=async()=>{if(busy)return;try{await fetch('/api/stop',{method:'POST'});setStatus('工具已关闭。需要时可重新双击「启动工具.cmd」。');byId('generate').disabled=true;byId('stop').disabled=true;}catch{setStatus('服务已关闭，或当前连接不可用。');}};
</script></body></html>
